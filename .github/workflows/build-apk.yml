name: Generar APK de Barbely

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK desde ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar ZIP
        run: |
          ls -la
          test -f "Barbely_APK_GitHub_Nuevo_Repositorio.zip"

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip -q "Barbely_APK_GitHub_Nuevo_Repositorio.zip" -d proyecto
          echo "Contenido del ZIP:"
          find proyecto -maxdepth 4 -type f | head -100

      - name: Localizar proyecto Android
        run: |
          GRADLEW=$(find proyecto -type f -name gradlew | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No se encontró gradlew dentro del ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Barbely-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 14
