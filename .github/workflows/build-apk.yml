name: Generar APK de Barbely

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK desde el ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Descomprimir proyecto Android
        run: |
          test -f Barbely_APK_GitHub_Nuevo_Repositorio.zip || {
            echo "ERROR: No se encuentra Barbely_APK_GitHub_Nuevo_Repositorio.zip en la raíz del repositorio."
            echo "Comprueba que el nombre del ZIP en GitHub sea exactamente ese."
            exit 1
          }
          mkdir -p proyecto
          unzip -q Barbely_APK_GitHub_Nuevo_Repositorio.zip -d proyecto
          echo "Contenido extraído:"
          find proyecto -maxdepth 3 -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \)

      - name: Compilar APK de Android
        working-directory: proyecto/Barbely-Android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Barbely-APK
          path: proyecto/Barbely-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
